{% extends "base.html" %}

{% block title %}Approval Queue{% endblock %}

{% block content %}
<div class="space-y-6">
  {# Breadcrumb #}
  <nav class="flex items-center gap-2 text-sm text-slate-500">
    <span class="text-slate-900 font-medium">Approval Queue</span>
  </nav>

  {# Queue table #}
  <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
    <div class="px-6 py-4 border-b border-slate-200 bg-slate-50 flex items-center justify-between">
      <h3 class="text-base font-semibold text-slate-900">Requests Awaiting Your Review</h3>
      <p class="text-xs text-slate-500">InfoSec approvers see submitted requests; Network approvers see InfoSec-approved requests.</p>
    </div>
    <div class="p-6">
      <div data-vue-component="approval-queue"
           data-vue-props='{{ queue_json }}'></div>
    </div>
  </div>
</div>
{% endblock %}
